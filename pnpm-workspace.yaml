packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  # Transitive dependencies with published security advisories — each is pulled
  # in by a package we don't control, so the fix is an override rather than a
  # bump in one of our own package.json files.
  sharp: '>=0.35.0'                      # Next.js image optimisation
  brace-expansion: '>=5.0.7'             # via minimatch/glob; only 5.x is in the tree
  fast-uri: '>=3.1.4 <4'                 # via ajv (NestJS request validation)
  body-parser: '>=1.20.6 <2'             # via express (Nest's HTTP adapter)
  uuid: '>=11.1.1 <12'
  multer: '>=2.2.0'
  qs: '>=6.15.2'
  tmp: '>=0.2.6'
  js-yaml: '>=4.3.0 <5'
  postcss: '>=8.5.10'
  webpack: '>=5.104.1'
  esbuild: '>=0.28.1'
  lodash: '>=4.18.0'
  file-type: '>=21.3.2'
  glob@10: '>=10.5.0'
  ajv@8: '>=8.18.0'
  picomatch@4: '>=4.0.4'
allowBuilds:
  '@nestjs/core': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  '@serialport/bindings-cpp': true
  unrs-resolver: true
