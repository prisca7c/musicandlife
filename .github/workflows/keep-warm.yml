name: Keep API warm

# Render's free tier spins the API down after ~15 min idle; the next request
# then eats a 30-90s cold start. This pings the health endpoint during UK
# daytime so the service stays awake while people actually use it. At night it
# is allowed to sleep, which keeps us well under Render's monthly free-hours cap.
#
# NOTE: GitHub's scheduled runs are best-effort and can be delayed several
# minutes (or skipped under load), so this greatly reduces cold starts but does
# not guarantee zero. For a hard guarantee use an external uptime monitor
# (e.g. UptimeRobot) hitting the same URL every 5 min, or Render's paid tier.

on:
  schedule:
    # Every 10 minutes, ~06:00-21:00 UTC (covers UK daytime year-round).
    - cron: '*/10 6-21 * * *'
  workflow_dispatch: {}

# If a previous run is still waking a cold service, don't pile up.
concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="https://musicandlifeapi.onrender.com/api/v1/health"
          for i in 1 2 3; do
            # --max-time 120 tolerates a cold wake-up (the ping itself may be
            # what starts the service back up).
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$URL" || echo "000")
            if [ "$code" = "200" ]; then echo "warm (HTTP $code)"; exit 0; fi
            echo "attempt $i -> HTTP $code, retrying in 10s"; sleep 10
          done
          echo "health check did not return 200"; exit 1
