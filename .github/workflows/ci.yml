name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          MAILRELAY_API_URL: ${{ secrets.MAILRELAY_API_URL }}
          MAILRELAY_API_KEY: ${{ secrets.MAILRELAY_API_KEY }}

  migration-check:
    name: Migration drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # drizzle-kit has no `generate --check`; detect drift by regenerating and
      # failing if that produces any uncommitted migration/snapshot changes.
      - name: Check for schema drift
        run: |
          pnpm --filter @music-life/db run generate
          if [ -n "$(git status --porcelain packages/db/src/migrations)" ]; then
            echo "::error::Schema drift detected — run 'pnpm db:generate' locally and commit the generated migration."
            git --no-pager diff -- packages/db/src/migrations
            exit 1
          fi
          echo "No schema drift."
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
